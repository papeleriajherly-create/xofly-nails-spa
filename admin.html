<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Xofly Nails & Spa</title><script src="/config.js"></script><style>body{font:16px system-ui;background:#f4fbff;color:#18345f;margin:0}.wrap{max-width:850px;margin:36px auto;padding:20px}section{background:white;padding:24px;border:1px solid #dceaf5;border-radius:18px;margin:20px 0}h1,h2{color:#063c9d}label{display:block;margin:12px 0}input,textarea,select{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:5px;border:1px solid #bcd5e6;border-radius:8px}button{padding:12px 18px;background:#063c9d;color:white;border:0;border-radius:9px;cursor:pointer;margin:5px 5px 5px 0}.secondary{background:#64748b}.danger{background:#b91c1c}.item{border-top:1px solid #ddd;padding:12px 0}small{color:#6b7c99}#msg{color:#a33417}</style><div class="wrap"><h1>🦋 Panel Xofly Nails & Spa</h1><p><a href="/">← Ver sitio público</a></p><p id="msg"></p><section id="login"><h2>Acceso del administrador</h2><form id="loginForm"><label>Correo<input type="email" id="email" required autocomplete="username"></label><label>Contraseña<input type="password" id="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><div id="panel" hidden><button id="logout" class="secondary">Cerrar sesión</button><section><h2 id="formTitle">Agregar contenido</h2><form id="editor"><label>Tipo<select id="kind"><option value="xofly_services">Servicio / precio</option><option value="xofly_promotions">Promoción</option></select></label><label>Título<input id="title" required maxlength="140"></label><label>Descripción<textarea id="description" rows="3" maxlength="1000"></textarea></label><label>Precio en MXN (opcional)<input id="price" type="number" min="0" step="0.01"></label><label>URL de fotografía HTTPS (opcional)<input id="image_url" type="url" placeholder="https://..."></label><label>Categoría (para servicios)<input id="category" value="General" maxlength="80"></label><label><input type="checkbox" id="active" checked style="display:inline;width:auto"> Visible al público</label><button id="save">Guardar</button><button type="button" id="cancel" class="secondary">Cancelar edición</button></form></section><section><h2>Servicios y precios</h2><div id="services"></div></section><section><h2>Promociones</h2><div id="promos"></div></section></div></div><script type="module">
const url=window.XOFLY_SUPABASE_URL,key=window.XOFLY_SUPABASE_ANON_KEY,msg=document.getElementById('msg');
if(!url||!key){msg.textContent='Falta configurar config.js con los datos públicos de Supabase.';document.getElementById('loginForm').querySelector('button').disabled=true;}
let token='',editId=null,editKind=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,opts={}){const r=await fetch(url+path,{...opts,headers:{apikey:key,Authorization:`Bearer ${token||key}`,'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok){let error=await r.text();throw Error(error.slice(0,250))}return r.status===204?null:await r.text().then(x=>x?JSON.parse(x):null)}
function notice(s){msg.textContent=s}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const x=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=x.access_token;const admins=await request('/rest/v1/xofly_admins?select=user_id&user_id=eq.'+encodeURIComponent(x.user.id));if(!admins?.length){token='';throw Error('Esta cuenta no está autorizada como administrador.')} $('login').hidden=true;$('panel').hidden=false;notice('Acceso autorizado.');await refresh()}catch(err){notice('No se pudo iniciar sesión: '+err.message)}};
$('logout').onclick=()=>{token='';$('password').value='';$('panel').hidden=true;$('login').hidden=false;notice('Sesión cerrada.')};
async function refresh(){for(const [table,target] of [['xofly_services','services'],['xofly_promotions','promos']]){const rows=await request(`/rest/v1/${table}?select=*&order=created_at.desc`);$(target).innerHTML=rows.length?'':'Sin registros todavía.';for(const x of rows){const el=document.createElement('div');el.className='item';el.innerHTML=`<b>${esc(x.name||x.title)}</b> — ${x.price==null?'Sin precio':'$'+Number(x.price).toFixed(2)} <small>${x.active?'Visible':'Oculto'}</small><p>${esc(x.description)}</p>`;const b=document.createElement('button');b.textContent='Editar';b.onclick=()=>{editId=x.id;editKind=table;$('kind').value=table;for(const f of ['description','image_url'])$(f).value=x[f]??'';$('title').value=x.name||x.title||'';$('category').value=x.category||'General';$('price').value=x.price??'';$('active').checked=x.active;$('formTitle').textContent='Editar contenido';window.scrollTo({top:0,behavior:'smooth'})};const d=document.createElement('button');d.textContent='Eliminar';d.className='danger';d.onclick=async()=>{if(!confirm('¿Eliminar este registro?'))return;try{await request(`/rest/v1/${table}?id=eq.${x.id}`,{method:'DELETE'});await refresh()}catch(err){notice(err.message)}};el.append(b,d);$(target).append(el)}}}
$('cancel').onclick=()=>{editId=null;editKind=null;$('editor').reset();$('formTitle').textContent='Agregar contenido'};
$('editor').onsubmit=async e=>{e.preventDefault();if(!token)return;const table=editKind||$('kind').value;const body={description:$('description').value.trim(),image_url:$('image_url').value.trim()||null,active:$('active').checked};if(table==='xofly_services'){body.name=$('title').value.trim();body.category=$('category').value.trim()||'General';body.price=$('price').value===''?null:Number($('price').value)}else{body.title=$('title').value.trim()};if(body.image_url&&!body.image_url.startsWith('https://'))return notice('La imagen debe usar una URL https://');try{await request('/rest/v1/'+table+(editId?'?id=eq.'+editId:''),{method:editId?'PATCH':'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});$('cancel').click();notice('Cambios guardados.');await refresh()}catch(err){notice('Error al guardar: '+err.message)}};
</script></html>
